# The public gitforage field guide at gitforage.dev. Its default view is a broad
# sample of open source, ordered for a general audience: AI and LLM tools, web,
# developer tools, databases, data and ML, security, systems languages, mobile,
# games, self-hosting, home automation and healthcare interoperability. There is
# no stars_from, so the guide stays neutral: its profile is learned from the
# seeds below, not from anyone's stars.
#
# Visitors can narrow it to their own patch from the catalog (site.personalize
# below). That re-ranking happens in their browser; the default view stays broad.

profile: |
  A field guide for people who build, run and tinker with software.

  It looks across open source for useful new tools and fast-growing projects:
  AI agents and local LLM tools, web frameworks, command-line and developer
  tools, databases, data and machine learning, security and privacy, Rust and
  Go, mobile apps, game development, self-hosted software, local-first home
  automation, and healthcare interoperability.

  It prefers projects that are active, licensed and documented, and in the Get
  involved tab, maintainers who merge outside pull requests and answer issues.

  Pick your patch to narrow it to the topics you care about.

topics:
  # AI agents and LLMs
  - llm
  - ai-agents
  - mcp
  # Web
  - react
  - svelte
  # Developer tools and the terminal
  - cli
  - devtools
  - terminal
  # Databases
  - database
  - postgresql
  # Data and machine learning
  - machine-learning
  # Security and privacy
  - security
  - privacy
  # Rust and Go
  - rust
  - golang
  # Mobile
  - android
  - flutter
  # Games
  - gamedev
  - godot
  # Self-hosting and homelab
  - self-hosted
  - homelab
  - docker
  # Home automation
  - home-assistant
  # Healthcare interoperability
  - fhir
  - hl7

seeds:
  - ollama/ollama
  - modelcontextprotocol/servers
  - sveltejs/svelte
  - BurntSushi/ripgrep
  - junegunn/fzf
  - duckdb/duckdb
  - godotengine/godot
  - immich-app/immich
  - home-assistant/core
  - hapifhir/hapi-fhir

exclude:
  # Lists of links, not tools. IPTV, M3U and XMLTV are left out of the public guide on purpose.
  topics: [awesome-list, awesome, list, iptv, iptv-player, iptv-m3u, m3u, m3u8, m3u-playlist, xmltv, epg]
  keywords: ["awesome-"]
  patterns:
    - regex: '\b(iptv|m3u8?|xmltv)\b'

filters:
  min_stars: 5
  max_age_days: 365
  # English descriptions only (repos whose language cannot be told still show).
  spoken_languages: [en]
  # Leave out repos whose stars look bought or botted.
  drop_suspected_star_farms: true

mode: discover
digest_size: 30

# Revival radar: projects in these topics whose upstream has gone quiet or been
# archived, carried on by a live fork. Shown on revival.html (the Revivals tab).
revival:
  enabled: true
  dormancy_months: 12
  max_candidates: 10

# Early finds: the live record behind the Found early page. The daily
# early-finds workflow keeps state/early-finds.json.
early_finds:
  enabled: true

site:
  repo: iacsha/gitforage-field-guide
  title: gitforage
  tag: beta
  url: https://gitforage.dev/
  # Cookieless visit counts (gitforage.goatcounter.com).
  # With personalize on, pack and topic picks are counted as GoatCounter events too.
  analytics: { provider: goatcounter, code: gitforage }
  personalize:
    enabled: true
    catalog:
      # The best 25 candidates per topic are kept (fewer if catalog.json would get too big).
      per_topic: 25
      groups:
        - name: AI agents and MCP
          topics: [claude-code, mcp, ai-agents, mcp-server, model-context-protocol, llm, rag, ollama, agentic-ai]
        - name: Web frameworks
          topics: [react, nextjs, vue, svelte, astro, htmx, tailwindcss, django, fastapi]
        - name: Developer tools and the terminal
          topics: [cli, terminal, devtools, tui, neovim, git, shell, developer-tools, vscode-extension]
        - name: Databases
          topics: [postgresql, sqlite, database, redis, duckdb, vector-database, orm]
        - name: Data and machine learning
          topics: [machine-learning, deep-learning, data-science, pytorch, computer-vision, data-engineering, nlp]
        - name: Security
          topics: [security, cybersecurity, privacy, encryption, authentication, devsecops, vulnerability-scanner]
        - name: Rust, Go and TypeScript
          topics: [rust, golang, typescript, webassembly, deno, bun, nodejs]
        - name: Mobile
          topics: [android, ios, flutter, react-native, kotlin, swiftui, jetpack-compose]
        - name: Games and game dev
          topics: [gamedev, game-engine, godot, bevy, emulator, pixel-art]
        - name: Self-hosting and homelab
          topics: [proxmox, self-hosted, selfhosted, homelab, docker, docker-compose, kubernetes, wireguard, backup, monitoring]
        - name: Home automation
          topics: [home-assistant, zigbee, matter, home-automation, esphome, mqtt, smart-home, iot]
        - name: Healthcare interoperability
          topics: [hl7, fhir, mirth, dicom, ehr, openehr, medical-imaging, pacs, healthcare, interoperability]
    packs:
      - { id: ai-builder, name: AI builder, topics: [claude-code, mcp, ai-agents, llm, rag, ollama] }
      - { id: web-dev, name: Web dev, topics: [react, nextjs, svelte, tailwindcss, htmx, typescript] }
      - { id: backend, name: Backend, topics: [postgresql, redis, sqlite, fastapi, django, docker] }
      - { id: data-ml, name: Data and ML, topics: [machine-learning, data-science, pytorch, duckdb, data-engineering] }
      - { id: terminal, name: Terminal life, topics: [cli, terminal, tui, neovim, shell, git] }
      - { id: security, name: Security, topics: [security, cybersecurity, privacy, encryption, authentication] }
      - { id: rust-go, name: Rust and Go, topics: [rust, golang, webassembly, cli] }
      - { id: mobile, name: Mobile apps, topics: [android, ios, flutter, kotlin, jetpack-compose] }
      - { id: gamedev, name: Game dev, topics: [gamedev, godot, bevy, game-engine, pixel-art] }
      - { id: homelab, name: Homelab, topics: [proxmox, self-hosted, homelab, docker, wireguard, backup] }
      - { id: smart-home, name: Smart home, topics: [home-assistant, zigbee, matter, esphome, mqtt] }
      - { id: healthcare-dev, name: Healthcare dev, topics: [hl7, fhir, dicom, mirth, ehr, interoperability] }
